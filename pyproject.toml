[project]
name = "kortek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.2.0",
    "fastapi==0.115.0",
    "httpx==0.27.0",
    "pyjwt==2.9.0",
    "motor==3.5.1",
    "numpy==1.26.4",
    "onnx==1.17.0",
    "onnxruntime-gpu==1.23.0",
    "onnxslim==0.1.96",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    "python-multipart>=0.0.9",
    "pydantic==2.8.0",
    "pydantic-settings==2.4.0",
    "pymongo==4.8.0",
    "pynvvideocodec>=2.2.0",
    "pywin32>=312",
    "requests==2.32.3",
    "tensorrt-cu12>=10.0,<11",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "ultralytics==8.4.24",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

